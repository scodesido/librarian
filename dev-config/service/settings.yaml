service:
  autoreload: true

database:
  user: admin
  password: admin-pass
  host: librarian-postgres
  port: 5432
  name: librarian

# google_oauth.client_id, .client_secret and .token_encryption_key are
# expected via env (LIBRARIAN__GOOGLE_OAUTH__CLIENT_ID, _CLIENT_SECRET,
# _TOKEN_ENCRYPTION_KEY) — typically loaded from a local .env file. The
# blob_extractor LLM/embedding keys come in via
# LIBRARIAN__BLOB_EXTRACTOR__ANTHROPIC_API_KEY and
# LIBRARIAN__BLOB_EXTRACTOR__VOYAGE_API_KEY.
