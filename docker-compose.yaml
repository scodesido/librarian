services:
  librarian-api:
    hostname: librarian-api
    container_name: librarian-api
    image: librarian-api:latest
    build:
      context: ./backend
    ports:
      - 127.0.0.1:8000:8000
    volumes:
      - ./backend/src:/app/src
      - ./backend/db:/app/db
      - ./dev-config/api/settings.yaml:/app/config/settings.yaml:ro
    env_file: .env

  librarian-service:
    hostname: librarian-service
    container_name: librarian-service
    image: librarian-service:latest
    build:
      context: ./backend
    entrypoint: [run-service]
    volumes:
      - ./backend/src:/app/src
      - ./backend/db:/app/db
      - ./dev-config/service/settings.yaml:/app/config/settings.yaml:ro

  librarian-web:
    hostname: librarian-web
    container_name: librarian-web
    image: librarian-web:dev
    build:
      context: ./frontend
      target: dev
    command: --host librarian-web
    ports:
      - 127.0.0.1:3000:3000
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public

  librarian-postgres:
    hostname: librarian-postgres
    container_name: librarian-postgres
    image: librarian-postgres:latest
    build:
      context: ./backend/db
    environment:
      - POSTGRES_DB=librarian
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin-pass
    volumes:
      - ./.container_data/postgres:/var/lib/postgresql/data
